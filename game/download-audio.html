<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>下载音效文件</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
button { background: #00d4ff; color: #000; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; }
button:hover { background: #00a8cc; }
#status { margin: 20px 0; padding: 15px; background: #16213e; border-radius: 5px; }
</style>
</head>
<body>
<h1>🎮 音效文件下载</h1>
<button onclick="downloadBGM()">下载背景音乐</button>
<button onclick="downloadCollect()">下载获得材料音效</button>
<button onclick="downloadAttack()">下载攻击音效</button>

<div id="status">等待下载...</div>

<script>
function updateStatus(msg) {
    document.getElementById('status').innerHTML = msg;
}

// 背景音乐
async function downloadBGM() {
    updateStatus('正在下载背景音乐...');
    try {
        const response = await fetch('file:///D:/工作文件夹/创业曲线20_游戏mvp/死亡细胞游戏目录/音效/背景音乐/bjyy.mp3');
        const blob = await response.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'bgm.mp3';
        a.click();
        URL.revokeObjectURL(url);
        updateStatus('✅ 背景音乐下载完成！请保存到: C:\\Users\\Administrator\\.qclaw\\workspace\\dead-cells-mvp\\sounds\\bgm.mp3');
    } catch(e) {
        updateStatus('❌ 下载失败: ' + e.message);
    }
}

// 获得材料音效
async function downloadCollect() {
    updateStatus('正在下载获得材料音效...');

        const response = await fetch('file:///D:/工作文件夹/创业曲线20_游戏mvp/死亡细胞游戏目录/音效/获得材料音效/hdcl.mp3');
        const blob = await response.blob();

        a.click();
        URL.revokeObjectURL(url);
        updateStatus('✅ 获得材料音效下载完成！请保存到: C:\\Users\\Administrator\\.qclaw\\workspace\\dead-cells-mvp\\sounds\\collect.mp3');
    } catch(e) {
        updateStatus('❌ 下载失败: ' + e.message);
    }
}

// 攻击音效
async function downloadAttack() {
    updateStatus('正在下载攻击音效...');
    try {
        const response = await fetch('file:///D:/工作文件夹/创业曲线20_游戏mvp/死亡细胞游戏目录/音效/玩家攻击音效/gj01.mp3');

    } catch(e) {
        updateStatus('❌ 下载失败: ' + e.message);
    }
}
</script>
</body>
</html>
