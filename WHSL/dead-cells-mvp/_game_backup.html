// ============================================================
// TapDB 数据分析模块（REST API 代理方式）
// ============================================================
var TAPDB = (function(){
  var deviceId = localStorage.getItem('tapdb_device_id');
  if(!deviceId){
    deviceId = 'web-' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
    localStorage.setItem('tapdb_device_id', deviceId);
  }
  var userId = localStorage.getItem('tapdb_user_id');
  if(!userId){
    userId = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
    localStorage.setItem('tapdb_user_id', userId);
  }
  // 用于去重
  var sessionEvents = {};

  function uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
  }

  function send(eventName, extraProps, overrides) {
    try {
      var event_uuid = uuid();
      var props = {
        os: 'Web',
        os_version: navigator.userAgent || 'unknown',
        width: window.innerWidth || 1920,
        height: window.innerHeight || 1080,
        device_model: navigator.platform || 'unknown',
        network: navigator.onLine ? '1' : '0',
        channel: 'TapTap',
        app_version: '1.0',
        sdk_version: '2.8.0',
        event_uuid: event_uuid
      };
      if(extraProps){
        for(var k in extraProps) props[k] = extraProps[k];
      }
      var payload = {
        device_id: deviceId,
        user_id: userId,
        type: 'track',
        name: eventName,
        properties: props
      };
      if(overrides){
        for(var k in overrides) payload[k] = overrides[k];
      }
      // 通过服务端代理上报
      fetch('/api/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(function(err){
        // 静默失败，不干扰游戏
      });
    } catch(e) {
      // 静默
    }
  }

  // 初始化：上报 device_login
  function init() {
    send('device_login', {
      device_id1: deviceId,
      device_id2: deviceId
    });
    // 同时上报 user_login 以便计算用户级 DAU 和留存
    send('user_login');
  }

  return {
    init: init,
    track: send,
    getDeviceId: function(){ return deviceId; },
    getUserId: function(){ return userId; }
  };
})();

var bgmAudio=null;
var bgmCtx=null;
var bgmBuffer=null;
// 音频池：按url复用Audio实例，避免频繁new Audio()导致内存泄漏
var AUDIO_POOL={};
function sfx(url,vol){
  if(!url)return;
  try{
    var a=AUDIO_POOL[url];
    if(!a){a=new Audio(url);AUDIO_POOL[url]=a;}
    a.volume=vol||0.7;
    a.currentTime=0; // 重置播放位置，支持连续触发
    var pr=a.play();
    if(pr!==undefined&&pr.catch)pr.catch(function(){});
  }catch(e){}
}
function playSound(type){
  var url='';
  if(type==='attack')url='audio/sfx/sfxplayerattack_sword.mp3';
  else if(type==='coin')url='audio/ui/sfx_conin.mp3';
  else if(type==='win')url='audio/ui/cgcg.mp3';
  else if(type==='lose')url='audio/ui/cgsb.mp3';
  else if(type==='upgrade')url='audio/ui/JN_SJ.MP3';
  else if(type==='monster_attack')url='audio/gongji/Monster_attack.MP3';
  sfx(url,0.7);
}
function startBGM(){
  // 如果已有bgmAudio且正在播放，不做任何事
  if(bgmAudio&&!bgmAudio.paused)return;
  // 如果已有bgmAudio但暂停了，恢复播放
  if(bgmAudio&&bgmAudio.paused){
    try{bgmAudio.play();}catch(e){}
    return;
  }
  // 首次创建 - 在用户手势中执行，确保浏览器允许
  try{
    bgmAudio=new Audio('audio/bgm/bgm.mp3');
    bgmAudio.loop=true;
    bgmAudio.volume=0.45;
    // 立即播放（在用户手势上下文中）
    var playPromise=bgmAudio.play();
    // 处理play()返回的Promise（某些浏览器需要）
    if(playPromise!==undefined){
      playPromise.catch(function(e){
        console.warn('BGM自动播放被阻止，等待用户交互后重试:', e.message);
        // 如果被阻止，尝试用AudioContext方式
        tryInitAudioContext();
      });
    }
  }catch(e){
    console.error('BGM创建失败:', e);
    tryInitAudioContext();
  }
}
function tryInitAudioContext(){
  if(bgmCtx)return;
  try{
    bgmCtx=new(window.AudioContext||window.webkitAudioContext)();
    // 加载音频文件
    var req=new XMLHttpRequest();
    req.open('GET','audio/bgm/bgm.mp3',true);
    req.responseType='arraybuffer';
    req.onload=function(){
      bgmCtx.decodeAudioData(req.response,function(buffer){
        bgmBuffer=buffer;
        playBGMWithContext();
      },function(){});
    };
    req.send();
  }catch(e){}
}
function playBGMWithContext(){
  if(!bgmCtx||!bgmBuffer)return;
  if(bgmCtx.state==='suspended')bgmCtx.resume();
  var source=bgmCtx.createBufferSource();
  source.buffer=bgmBuffer;
  source.loop=true;
  source.connect(bgmCtx.destination);
  source.start(0);
  // 保存source以便后续可以停止
  bgmAudio={_ctxSource:source};
}

var WPNS_PER_ROOM=null;
var WPNS=null;
var ED=null;
var ROOM_CFG=null;
var TOTAL_ROOMS=153;
var GAME_CONFIG=null;

async function loadGameConfig(){
  try{
    console.log('开始加载游戏配置...');
    var response=await fetch('game-config.json');
    console.log('游戏配置响应状态:', response.status, response.ok);
    if(!response.ok)throw new Error('Failed to load config, status: ' + response.status);
    GAME_CONFIG=await response.json();

    // 转换武器配置格式
    WPNS_PER_ROOM=[];
    for(var i=0;i<GAME_CONFIG.rooms.length;i++){
      var roomWeapons=[];
      for(var wType in GAME_CONFIG.weapons){
        var weapon=GAME_CONFIG.weapons[wType].find(function(w){return w.room===i;});
        if(weapon)roomWeapons.push(weapon);
      }
      WPNS_PER_ROOM.push(roomWeapons);
    }

    // 加载怪物配置
    ED=GAME_CONFIG.enemies;

    // 转换房间配置格式
    ROOM_CFG=GAME_CONFIG.rooms.map(function(room){
      return{
        doorScore:room.doorScore,
        bossScore:room.bossScore,
        spawnInt:room.spawnInt,
        spawnMin:room.spawnMin,
        spawnMax:room.spawnMax,
        diff:room.diff,
        types:room.enemyTypes
      };
    });

    console.log('游戏配置加载成功！武器配置:', GAME_CONFIG.weapons, '房间数:', GAME_CONFIG.rooms.length);
    return true;
  }catch(e){
    console.error('游戏配置加载失败:',e);
    console.error('Stack:', e.stack);
    return false;
  }
}

  '灵魂圣殿','业火之窟','镜象禁区','终极审判','亡魂本源'
];
function bpGetRoundName(room){
  var roundNum=Math.floor(room/3)+1;
  if(roundNum<=CHAPTER_NAMES.length)return CHAPTER_NAMES[roundNum-1];
  return'XX'; // 超出50章用占位符
}
function bpIsBoss(room){
  return ROOM_CFG&&ROOM_CFG[room]&&ROOM_CFG[room].bossScore>0;
}
function updateBattlePass(newRoom){
  var ns=[];for(var i=-2;i<=2;i++){var r=newRoom+i;ns.push(r>=0&&r<TOTAL_ROOMS?r:-1);}
  if(BP.prevSlots===null){BP.slots=ns.slice();BP.prevSlots=ns.slice();return;}
  BP.prevSlots=BP.slots.slice();
  BP.slots=ns.slice();
  BP.phase=1;BP.phaseStart=Date.now();BP.bounceScale=1;
}
function tickBattlePass(){
  if(BP.phase===0)return;
  var now=Date.now();
  if(BP.phase===1){
    var t=Math.min((now-BP.phaseStart)/400,1);
    if(t>=1){BP.prevSlots=null;BP.phase=2;BP.phaseStart=now;}
  }else if(BP.phase===2){
    var t=Math.min((now-BP.phaseStart)/400,1);
    if(t<0.3)BP.bounceScale=1+0.15*(t/0.3);
    else if(t<0.7)BP.bounceScale=1.15-0.20*((t-0.3)/0.4);
    else BP.bounceScale=0.95+0.05*((t-0.7)/0.3);
    if(t>=1){BP.bounceScale=1;BP.phase=0;}
  }
}
function drawBattlePass(){
  var im=BP_IMAGES;
  if(!im.bt01||!im.bt01.complete||!im.bt01.naturalWidth)return;
  // 1. 标题条 bt01（右边距711px）
  var btX=1920-711-318,btY=0;
  ctx.drawImage(im.bt01,btX,btY,318,116);
  var rn=bpGetRoundName(G.room);
  ctx.fillStyle='#caa98a';ctx.font='bold 28px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText(rn,btX+159,btY+116-30);
  // 2. 进度组
  var ss=BP.SLOT_STEP,cx=BP.CENTER_X,cy=BP.CENTER_Y,gh=BP.GROUP_H,sc=BP.SCALES;
  var phase=BP.phase,now=Date.now();
  var useSlots=phase===1?BP.prevSlots:BP.slots;
  for(var i=0;i<5;i++){
    var room=useSlots[i];
    var isEmpty=(room<0);
    if(isEmpty&&(i>=2))continue; // 右侧未解锁的空位不占位
    var drawX,drawScale;
    var bScale=(i===2&&phase===2)?BP.bounceScale:1;
    if(phase===1){
      var p=Math.min((now-BP.phaseStart)/400,1);
      var e=p<0.5?2*p*p:-1+(4-2*p)*p;
      drawX=cx+(i-2-e)*ss;
      var tIdx=Math.max(0,i-1);
      drawScale=(sc[i]*(1-e)+sc[tIdx]*e)*bScale;
    }else{
      drawX=cx+(i-2)*ss;
      drawScale=sc[i]*bScale;
    }
    var dw=BP.SLOT_W*drawScale,dh=gh*drawScale;
    var dx=drawX-dw/2,dy=cy+(gh-dh)/2;
    ctx.save();
    ctx.translate(dx+dw/2,dy+dh/2);
    ctx.scale(drawScale,drawScale);
    var isCurrent=(i===2);
    var isUpcoming=(i>=3);
    var hasBoss=!isEmpty&&bpIsBoss(room);
    // 背景：当前关卡始终红色(kqhk_h01)，其他关卡正常(kqhk01)
    if(isCurrent){
      var kh=im.kqhk_h01;
      if(kh&&kh.complete&&kh.naturalWidth>0)ctx.drawImage(kh,-38,-17,76,60);
    }else{
      var kq=im.kqhk01;
      if(kq&&kq.complete&&kq.naturalWidth>0)ctx.drawImage(kq,-38,-21,76,64);
    }
    // 怪物图标：只在BOSS关出现
    if(hasBoss){
      if(isCurrent){
        // 当前BOSS关用guai02
        var g2=im.guai02;
        if(g2&&g2.complete&&g2.naturalWidth>0)ctx.drawImage(g2,-21,-43,42,35);
      }else if(isUpcoming){
        // 未解锁BOSS关用guai01
        var g1=im.guai01;
        if(g1&&g1.complete&&g1.naturalWidth>0)ctx.drawImage(g1,-21,-43,42,35);
      }
      // 已通关的BOSS关（i<2）不显示怪物图标
    }
    // 数字居中在背景块上
    if(!isEmpty){
      ctx.fillStyle='#caa98a';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(room+1,0,11);
    }
    ctx.restore();
  }
}

// 死亡回退弹框：闯《xx》失败，退回到第x关（bt01底边下方70px，YXCJ_tongyong_tisi01 489×70 + 文字）
function drawDeathPopup(){
  if(!deathPopupAnim)return;
  var im=BP_IMAGES;
  if(!im.tisi01||!im.tisi01.complete||!im.tisi01.naturalWidth)return;
  var now=Date.now();
  if(now<deathPopupAnim.startTime)return; // 等待延迟结束再出生
  var elapsed=now-deathPopupAnim.startTime;
  var PW=489,PH=70; // 弹框实际尺寸
  var popupTop=180; // 距屏幕顶部180px
  var popupCY=popupTop+PH/2; // 弹框中心Y
  var centerLeft=1046-PW/2; // 弹框中心点距左边1046px, 距右边876px → 左边缘=801.5
  var entryStartLeft=W-297-PW; // 右边缘距右297→左边缘=1920-297-489=1134
  var exitEndLeft=237; // 退场左边缘=237
  var posX,alphaVal=1;

  if(elapsed<600){
    // 入场回弹 0.6s: easeOutBack, 右→中, 过冲后稳定
    var t=Math.min(elapsed/600,1);
    var eased=cubicBezier(t,0.34,1.56,0.64,1);
    posX=entryStartLeft+(centerLeft-entryStartLeft)*eased;
  }else if(elapsed<2100){
    // 中间停留 1.5s
    posX=centerLeft;
  }else if(elapsed<2700){
    // 退场回弹 0.6s: easeInBack, 中→左
    var t=Math.min((elapsed-2100)/600,1);
    var eased=cubicBezier(t,0.36,0,0.66,-0.56);
    posX=centerLeft+(exitEndLeft-centerLeft)*eased;
    if(t>=0.8)alphaVal=1-(t-0.8)/0.2;
  }else{
    deathPopupAnim=null;return;
  }

  // 绘制
  ctx.save();
  ctx.globalAlpha=Math.max(0,alphaVal);
  ctx.drawImage(im.tisi01,posX,popupTop,PW,PH);
  // 文字：闯《哀恸礼堂》失败,退回到第1关
  var txt='闯《'+deathPopupAnim.chapterName+'》失败,退回到第'+deathPopupAnim.retryLevel+'关';
  ctx.fillStyle='#caa98a';ctx.font='bold 26px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(txt,posX+PW/2,popupCY);
  ctx.restore();
}

// 获取当前房间对应的boss资源名（3种boss循环）
function getBossResourceName(room){
  return ROUND_BOSS_TYPES[Math.floor(room/3)%3];
}

// 获取当前房间对应的boss配置（按关卡缩放）
function getBossConfig(room){
  var resName=getBossResourceName(room);
  var base=BOSS_CONFIG[resName]||BOSS_CONFIG.boss01;
  var cycle=Math.floor(room/3);
  var scale=1+cycle*0.2;
  return{
    hp:Math.round(base.hp*scale),
    cd:Math.max(25,Math.round(base.cd/scale)),
    sz:Math.min(3.5,base.sz+cycle*0.015),
    dmg:Math.round(base.dmg*scale),
    spd:base.spd+cycle*0.08,
    bullets:Math.min(30,base.bullets+Math.floor(cycle*0.2))
  };
}

function ensureSprite(name){
  if(SPRITES[name])return;
  var def=SPRITE_DEFS[name];
  if(!def)return;
  var frames=[];
  var prefix=def.prefix||'frame';
  var startIdx=def.startIdx||0;
  var pad=def.pad||0;
  var indices=def._customIndices;
  for(var i=0;i<def.frames;i++){
    var img=new Image();
    var idx=indices?indices[i]:(startIdx+i);
    var numStr=''+idx;
    if(pad>0)while(numStr.length<pad)numStr='0'+numStr;
    img.src=def.path+prefix+numStr+'.png';
    frames.push(img);
  }
  SPRITES[name]={frames:frames,fps:def.fps,loop:def.loop!==false,frame:0,timer:0};
}

function getSpriteFrame(name, speedMult){
  speedMult=speedMult||1;
  ensureSprite(name);
  var sp=SPRITES[name];
  if(!sp)return null;
  var f=sp.frames[sp.frame];
  if(!f||!f.complete||f.naturalWidth===0)return null;
  sp.timer+=speedMult;
  var tickInterval=60/sp.fps;
  if(sp.timer>=tickInterval){var skip=Math.floor(sp.timer/tickInterval);for(var s=0;s<skip;s++){if(sp.loop||sp.frame<sp.frames.length-1)sp.frame=(sp.frame+1)%sp.frames.length;}sp.timer-=skip*tickInterval;}
  return f;
}

function makeMap(){

  for(var y=0;y<Math.floor(H/TILE);y++){
    m[y]=[];
    for(var x=0;x<Math.floor(W/TILE);x++){
      m[y][x]=(x===0||x===Math.floor(W/TILE)-1||y===0||y===Math.floor(H/TILE)-1)?1:0;
    }
  }
  return m;
}

function addEnemyOne(type){
  var d=ED[type];if(!d)return;

  for(var attempt=0;attempt<10;attempt++){
    var angle=(Math.random()-0.5)*Math.PI/2; // 右侧扇形: -45°~45°
    var dist=100+Math.random()*300; // 100~400px
    var tx=Math.floor((G.p.x+Math.cos(angle)*dist)/TILE);
    var ty=Math.floor((G.p.y+Math.sin(angle)*dist)/TILE);
    var cols=Math.floor(W/TILE),rows=Math.floor(H/TILE);
    if(tx>0&&tx<cols-1&&ty>0&&ty<rows-1&&G.map[ty]&&G.map[ty][tx]===0){
      G.enemies.push({
        type:type,x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,

    }
  }
}

function tickPlayer(){
  var p=G.p;if(!p)return;
  // ★ 传送门opening状态：冻结输入，角色匀速缩小移动到传送门中心
  if(G.doorState==='opening'){
    p.vx=0;p.vy=0;
    var _dcx=G._doorCenterX||(W/2);var _dcy=G._doorCenterY||(H/2);
    var _progress=(300-G.doorTimer)/300; // 0→1 over 5秒
    if(_progress>1)_progress=1;
    // 匀速移动：当前位置→传送门中心
    if(G._doorPlayerStartX!==undefined){
      p.x=G._doorPlayerStartX+(_dcx-G._doorPlayerStartX)*_progress;
      p.y=G._doorPlayerStartY+(_dcy-G._doorPlayerStartY)*_progress;
    }
    // 朝向传送门
    p.facingRight=(_dcx>p.x);
    p._doorProgress=_progress;
    return;
  }
  var spd=p.roll?4.5:4.5,mx=0,my=0;
  if(touch.x!==0||touch.y!==0){mx=touch.x;my=touch.y;}
  else{
    if(keys['KeyW']||keys['ArrowUp'])my=-1;
    if(keys['KeyS']||keys['ArrowDown'])my=1;
    if(keys['KeyA']||keys['ArrowLeft'])mx=-1;
    if(keys['KeyD']||keys['ArrowRight'])mx=1;
  }

  // ▶ 归一化输入 (防止斜向移动速度比直线快 √2 倍)
  var inputMag=Math.hypot(mx,my);
  if(inputMag>1){mx/=inputMag;my/=inputMag;}

  // ▶ 目标速度
  var targetVx=mx*spd;
  var targetVy=my*spd;

  // ▶ 加速度/减速度模型 (帧率无关)
  var dt=FIXED_STEP/1000; // ≈0.0167s
  var currentSpeed=Math.hypot(p.vx,p.vy);
  var targetSpeed=Math.hypot(targetVx,targetVy);
  var isAccel=targetSpeed>currentSpeed;
  var timeConst=isAccel?0.04:0.03; // 加速40ms, 减速30ms 到达目标
  var lambda=1-Math.exp(-dt/timeConst);
  p.vx=p.vx+(targetVx-p.vx)*lambda;
  p.vy=p.vy+(targetVy-p.vy)*lambda;

  // ▶ 朝向翻转防抖 (独立 facingRight, 松手不归零)
  var FLIP_THRESHOLD=0.15;
  var FLIP_COOLDOWN=0.08; // 两次翻转最小间隔(秒)
  var nowSec=frame/60;
  if(nowSec-p.lastFlipTime>FLIP_COOLDOWN){
    if(mx>FLIP_THRESHOLD&&!p.facingRight){p.facingRight=true;p.lastFlipTime=nowSec;}
    else if(mx<-FLIP_THRESHOLD&&p.facingRight){p.facingRight=false;p.lastFlipTime=nowSec;}
  }
  p.facing=p.facingRight?1:-1; // 同步旧 facing

  // ▶ 动画播放速度联动移动速度
  var velMag=Math.hypot(p.vx,p.vy);
  var speedRatio=Math.min(velMag/spd,1);
  p.animSpeedMult=1.0+speedRatio*0.2; // 慢推1.0x, 全速1.2x

  // ▶ 翻滚 (unchanged)
  if(p.roll){p.rollT--;p.invT=4;p.state='miss';if(p.rollT<=0){p.roll=false;p.rollCd=40;}}
  else{if(p.rollCd>0)p.rollCd--;}

  // ▶ 位置更新
  var nx=p.x+p.vx,ny=p.y+p.vy;
  var tx=Math.floor(nx/TILE),ty=Math.floor(ny/TILE);
  var cols=Math.floor(W/TILE),rows=Math.floor(H/TILE);
  if(tx>=0&&tx<cols&&ty>=0&&ty<rows&&G.map[ty]&&G.map[ty][tx]===0){p.x=nx;p.y=ny;}
  else{p.vx=0;p.vy=0;}

  // ▶ 状态 (unchanged)
  if(p.invT>0)p.invT--;
  if(p.hurtT>0){p.hurtT--;if(p.missAnimT<=0)p.state='hit';}
  else if(p.atkT>0){p.atkT--;p.state='attack';}
  else if(!p.roll){p.state='idle';}
  if(p.wpnCd>0)p.wpnCd--;
  if(p.missAnimT>0)p.missAnimT--;
  // 击退衰减
  if(Math.abs(p.knockVx)>0.1||Math.abs(p.knockVy)>0.1){
    var _nkx=p.x+p.knockVx,_nky=p.y+p.knockVy;
    var _nktx=Math.floor(_nkx/TILE),_nkty=Math.floor(_nky/TILE);
    var _cls=Math.floor(W/TILE),_rws=Math.floor(H/TILE);
    if(_nktx>0&&_nktx<_cls-1&&_nkty>0&&_nkty<_rws-1&&G.map[_nkty]&&G.map[_nkty][_nktx]===0){p.x=_nkx;p.y=_nky;}
    p.knockVx*=0.82;p.knockVy*=0.82;
    if(Math.abs(p.knockVx)<0.2)p.knockVx=0;
    if(Math.abs(p.knockVy)<0.2)p.knockVy=0;
  }
}

function dmgE(e,dmg){
  if(e.dead||e.missAnimT>0)return;
  e.hp-=dmg;e.ht=0;e.state='miss';e.missAnimT=54;
  // 从玩家方向击退
  if(G.p){
    var _edx=e.x-G.p.x,_edy=e.y-G.p.y;
    var _edist=Math.hypot(_edx,_edy)||1;
    e.x+=_edx/_edist*24;e.y+=_edy/_edist*24;
  }
  var _esp=SPRITES[e.type+'_miss'];if(_esp)_esp.frame=0;
  addFText(e.x,e.y-16,'-'+dmg,'#ff5555');
  shake=Math.max(shake,2);
  if(e.hp<=0){
    e.dead=true;e.dying=20;G.kills++;G.p.score+=e.sc;G.roomScore+=e.sc;G.lastKillFrame=frame;if(G.monstersAlive!==undefined)G.monstersAlive--;
    addFText(e.x,e.y-22,'+'+e.sc,'#ffd700');
    playSound('coin');
  }
}

function hurtP(dmg,sx,sy){
  var p=G.p;if(!p||p.invT>0||p.roll)return;
  p.hp-=dmg;p.hurtT=15;p.invT=45;p.state='miss';p.missAnimT=45;
  // 击退方向(从攻击者指向玩家)
  if(typeof sx==='number'&&typeof sy==='number'){
    var _hdx=p.x-sx,_hdy=p.y-sy;
    var _hdist=Math.hypot(_hdx,_hdy)||1;
    p.knockVx=_hdx/_hdist*10;p.knockVy=_hdy/_hdist*10;
  }
  var _msp=SPRITES['player_miss'];if(_msp)_msp.frame=0;
  addFText(p.x,p.y-20,'-'+dmg,'#ff4040');
  shake=Math.max(shake,6);
  if(p.hp<=0){
    p.hp=0;G.phase='dead';G.endFrame=frame;
    playSound('lose');
    showDeadPage('在第'+(G.room+1)+'关倒下    击杀:'+G.kills+'     分数:'+p.score+'   不服继续挑战！');
    if(typeof TAPDB!=='undefined')TAPDB.track('player_death',{room:G.room,roomName:G.room+1,kills:G.kills,score:p.score});

}

function doAttack(){
  var p=G.p;if(!p||p.wpnCd>0||p.roll||G.doorState==='opening')return;
  var w=WPNS[p.wpn];p.wpnCd=Math.max(w.cd,30);p.atkT=30;p.state='attack';shake=Math.max(shake,2);
  ensureSprite('player_attack');var sp=SPRITES['player_attack'];if(sp){sp.frame=0;sp.timer=0;}
  ensureSprite('player_attack_fx');var fxSp=SPRITES['player_attack_fx'];if(fxSp){fxSp.frame=0;fxSp.timer=0;}
  playSound('attack');
  if(w.kind==='melee'){
    G.enemies.forEach(function(e){
      if(e.dead)return;
      var dx=e.x-p.x,dy=e.y-p.y,dist=Math.hypot(dx,dy);
      if(dist<TILE*w.rng){dmgE(e,w.dmg);}
    });
    if(G.boss&&!G.boss.dead){
      var dx=G.boss.x-p.x,dy=G.boss.y-p.y;
      if(Math.hypot(dx,dy)<TILE*w.rng*1.4){dmgBoss(w.dmg);}
    }
    // 检测是否砍中浮动技能动画
    for(var fi=floatingSkills.length-1;fi>=0;fi--){
      var fs=floatingSkills[fi];
      var fdx=fs.x-p.x,fdy=fs.y-p.y,fdst=Math.hypot(fdx,fdy);
      if(fdst<TILE*w.rng*1.2){
        // 触发飞行动画：收回技能图标
        triggerSkillFly(fs);
        floatingSkills.splice(fi,1);
      }
    }
  }else{
    addProj(p.x+p.facing*16,p.y,p.facing*(w.spd||12),0,w.dmg,true);
  }
}

// 获得dazhao组中心在canvas画布坐标系中的坐标
// 直接读取元素的getBoundingClientRect→screenToCanvas，结果是精确的渲染位置
function getDazhaoTargetCanvas(slotId){
  var el=document.getElementById(slotId);
  if(!el)return{x:0,y:0};
  // dazhao是vctrl的子元素。桌面端vctrl是display:none→rect=0,回退到CSS硬编码
  var r=el.getBoundingClientRect();
  if(r.width>0&&r.height>0){
    // 元素可见：直接用精确渲染位置转换
    var cx=r.left+r.width/2;
    var cy=r.top+r.height/2;
    return screenToCanvas(cx,cy);
  }
  // 回退(桌面端vctrl隐藏)：手动CSS→视口坐标
  var cssR=parseFloat(el.style.right)||0;
  var cssB=parseFloat(el.style.bottom)||0;
  var hw=(parseFloat(el.style.width)||40)/2;
  var hh=(parseFloat(el.style.height)||40)/2;
  return screenToCanvas(window.innerWidth-cssR-hw,window.innerHeight-cssB-hh);
}

function triggerSkillFly(fs){
  // 随机选一个dazhao槽位（优先空槽，否则随机覆盖）
  var slotKeys=['dazhao01','dazhao02','dazhao03','dazhao04'];
  var emptySlots=slotKeys.filter(function(k){return !dazhaoSlots[k];});
  var targetSlot=emptySlots.length>0?emptySlots[Math.floor(Math.random()*emptySlots.length)]:slotKeys[Math.floor(Math.random()*4)];
  var sx=fs.x,sy=fs.y;
  // ★砍击瞬间确定最终消失点——固定目标不变
  var target=getDazhaoTargetCanvas(targetSlot);
  var tx=target.x,ty=target.y;
  // debug: 验证目标坐标 — 对比dazhao元素getBoundingClientRect中心值
  var _el=document.getElementById(targetSlot);
  if(_el){var _r=_el.getBoundingClientRect();console.log('fly to '+targetSlot+
    ' | viewport:('+window.innerWidth+'x'+window.innerHeight+')'+
    ' | css right:'+_el.style.right+' bottom:'+_el.style.bottom+
    ' | bcr center:('+Math.round(_r.left+_r.width/2)+','+Math.round(_r.top+_r.height/2)+')'+
    ' | → canvas target:('+tx+','+ty+')');}
  // 弧线控制点：最高点位于水平距离30%处
  var peakRatio=0.30;
  var cpX=sx+(tx-sx)*peakRatio;
  var cpY=Math.min(sy,ty)-180;
  dazhaoSlots[targetSlot]=null;
  ensureSprite('fwtx_holylance');var fwSp=SPRITES['fwtx_holylance'];if(fwSp){fwSp.frame=0;fwSp.timer=0;}
  flyIcons.push({
    startTime:Date.now(),
    dur:1600,
    fromX:sx,fromY:sy,
    toX:tx,toY:ty,        // ★固定目标，不再每帧重算
    cpX:cpX,cpY:cpY,
    targetSlot:targetSlot,
    skillType:fs.skillType,
    impactSfxPlayed:false,
    impactGlow:0,
    trail:[]
  });
}

function dmgBoss(dmg){
  var b=G.boss;if(!b||b.dead)return;
  b.hp-=dmg;b.ht=8;b.state='hit';

    b.dying=0;

    loadBG(G.room+2);

function usePotion(){

function tickE(){
  // 敌人间分离力：第一遍计算所有分离向量，避免多个敌人堆叠在同一个位置
  for(var i=0;i<G.enemies.length;i++){
    var e=G.enemies[i];
    e._sx=0;e._sy=0;
    if(e.dead||e.stun>0||e.missAnimT>0)continue;
    for(var j=i+1;j<G.enemies.length;j++){
      var o=G.enemies[j];
      if(o.dead||o.stun>0||o.missAnimT>0)continue;
      var sdx=e.x-o.x,sdy=e.y-o.y,sdist=Math.hypot(sdx,sdy);
      if(sdist<96&&sdist>0.1){
        var f=(96-sdist)/96*3.0;
        var sx=sdx/sdist*f,sy=sdy/sdist*f;
        e._sx+=sx;e._sy+=sy;
        o._sx-=sx;o._sy-=sy;
      }
    }
  }

  for(var i=G.enemies.length-1;i>=0;i--){
    var e=G.enemies[i];
    if(e.dead){e.dying--;if(e.dying<=0)G.enemies.splice(i,1);continue;}
    if(e.missAnimT>0){e.missAnimT--;if(e.state!=='miss')e.state='miss';continue;}
    if(e.stun>0){e.stun--;e.state='miss';continue;}
    if(e.ht>0){e.ht--;if(e.ht===0)e.state='idle';continue;}
    var p=G.p;if(!p)continue;
    var dx=p.x-e.x,dy=p.y-e.y,dist=Math.hypot(dx,dy);
    e.ang=Math.atan2(dy,dx);e.facingRight=dx>0;e.curA--;
    // 近战停止距离放宽到TILE(48px)，远程保持10px
    var stopDist=e.rng?10:TILE;
    if(e.curA<=0){
      if(e.rng&&dist<e.ar*TILE*1.3){
        addProj(e.x,e.y,dx/dist*3.5,dy/dist*3.5,e.dmg,false);playSound('monster_attack');
        e.state='attack';e.curA=e.ac;
      }else if(!e.rng&&dist<stopDist){
        hurtP(e.dmg,e.x,e.y);playSound('monster_attack');e.state='attack';e.curA=e.ac;
      }else{e.state='idle';}
    }
    if(dist>stopDist){
      e.x+=dx/dist*e.spd+e._sx;
      e.y+=dy/dist*e.spd+e._sy;
      if(e.state==='idle')e.state='attack';
    }
  }
  if(G.boss)tickBoss();
}

function tickBoss(){
  var b=G.boss;if(!b)return;
  var p=G.p;

  // 死亡动画播放
  if(b.dead){
    b.dying++;
    var deadFrameCount=0;
    var resName=getBossResourceName(G.room);
    if(resName==='boss01')deadFrameCount=9;
    else if(resName==='boss02')deadFrameCount=11;
    else if(resName==='boss03')deadFrameCount=9;
    var deadDuration=deadFrameCount*BOSS_FRAME_INTERVAL;
    if(b.dying>deadDuration+60){
      G.phase='win';
      G.endFrame=frame;
      G.boss=null;
      var nextMsg='';
      if(G.room>=TOTAL_ROOMS-1){
        nextMsg='恭喜完成全部关卡! 击杀:'+G.kills+' 最终分数:'+G.p.score;
      }else{
        var nextRoundStart=getRoundStartRoom(G.room+1);
        var nextRoomName=GAME_CONFIG&&GAME_CONFIG.rooms&&GAME_CONFIG.rooms[nextRoundStart]?GAME_CONFIG.rooms[nextRoundStart].name:'下一关';
        nextMsg='恭喜通关! 即将进入'+nextRoomName+' 击杀:'+G.kills+' 分数:'+G.p.score;
      }
      showWinPage(nextMsg);
    }
    return;
  }

  // 玩家与boss碰撞检测（boss尺寸256x256px）
  var bossRadius=128;
  var touchingBoss=false;
  if(p){
    var dx=p.x-b.x,dy=p.y-b.y;
    var dist=Math.hypot(dx,dy);
    touchingBoss=dist<bossRadius+20;
    // Boss朝向：玩家在右边时boss面朝右（水平翻转）
    b.facingRight=dx>0;
  }

  // 状态管理
  if(b.ht>0){
    b.ht--;
    if(b.ht===0){
      b.state=touchingBoss?'attack':'idle';
    }
  }else{
    b.state=touchingBoss?'attack':'idle';
  }

  // 移动向玩家（与小怪逻辑一致，保持一定距离发射弹幕）
  if(p&&b.ht<=0&&dist>bossRadius+40){
    b.x+=dx/dist*b.spd;b.y+=dy/dist*b.spd;
    if(b.state==='idle')b.state='attack';
  }

  // 近战攻击（触碰玩家时造成伤害）
  if(touchingBoss&&p&&p.invT<=0){
    b.curA=(b.curA||0)-1;
    if(b.curA<=0){
      hurtP(b.dmg||15,G.boss.x,G.boss.y);playSound('monster_attack');
      b.curA=b.cdMax||90;
    }
  }
}


function addProj(x,y,vx,vy,dmg,frn){
  projs.push({x:x,y:y,vx:vx,vy:vy,dmg:dmg,frn:frn,life:65,prc:0});
}

function tickProjs(){
  projs=projs.filter(function(p){
    p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)return false;
    if(p.frn){
      G.enemies.forEach(function(e){
        if(e.dead)return;
        if(Math.hypot(p.x-e.x,p.y-e.y)<TILE*e.sz){dmgE(e,p.dmg);p.prc++;}
      });
      if(G.boss&&!G.boss.dead&&Math.hypot(p.x-G.boss.x,p.y-G.boss.y)<TILE*G.boss.sz){dmgBoss(p.dmg);return false;}
      if(p.prc>=2)return false;
    }else{
      var pl=G.p;
      if(pl&&pl.invT<=0&&Math.hypot(p.x-pl.x,p.y-pl.y)<20){hurtP(p.dmg,p.x,p.y);return false;}
    }
    return true;
  });
}

// 加载页渲染
function drawLoading(){
  if(!loadingState||!QDY_IMAGES)return;
  ctx.save(); // 保护ctx状态
  // 画布背景填充（保证QDY图未加载时也能看到加载页）
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  var ls=loadingState;
  // 固定时长轮播：3张logo均分12秒（每张4秒含0.4秒淡入淡出），logo水平垂直居中，黑底代码绘制
  var totalImgs=3;
  var cycleDur=12/3;
  var fadeDur=0.4;
  var elapsed=(Date.now()-ls.startTime)/1000;
  var t=Math.min(elapsed,12);
  var curIdx=Math.min(totalImgs-1,Math.floor(t/cycleDur));
  var phaseT=t-curIdx*cycleDur;
  var alpha0=1,alpha1=0;
  var nextIdx=null;
  if(phaseT>cycleDur-fadeDur&&curIdx<totalImgs-1){
    var ft=(phaseT-(cycleDur-fadeDur))/fadeDur;
    alpha0=1-ft; alpha1=ft;
    nextIdx=curIdx+1;
  }

  // 当前logo（水平垂直居中）
  var img0=QDY_IMAGES[curIdx];
  if(img0&&img0.complete&&img0.naturalWidth>0){
    ctx.globalAlpha=Math.max(0,alpha0);
    ctx.drawImage(img0,(W-img0.naturalWidth)/2,(H-img0.naturalHeight)/2);
  }
  // 下一张logo（淡入）
  if(nextIdx!==null){
    var img1=QDY_IMAGES[nextIdx];
    if(img1&&img1.complete&&img1.naturalWidth>0&&alpha1>0){
      ctx.globalAlpha=Math.max(0,alpha1);
      ctx.drawImage(img1,(W-img1.naturalWidth)/2,(H-img1.naturalHeight)/2);
    }
  }
  ctx.globalAlpha=1;

  // 进度条系统
  var jdt=JDT_IMAGES;
  var pbW=1408,pbH=7,iconW=102,iconH=81;
  // 底框 jdt01 水平居中，距屏幕底30px（整体上移10px）
  var pbX=(W-pbW)/2;
  var pbY=H-30-pbH;

  // === 进度文字 ===
  var pct=Math.round(ls.progress*100);
  ctx.fillStyle='#caa98a';ctx.font='bold 22px Arial';ctx.textAlign='center';
  ctx.fillText('资源加载中... '+pct+'%',W/2,H-25-30);

  // jdt01底框
  if(jdt.jdt01&&jdt.jdt01.complete&&jdt.jdt01.naturalWidth>0){
    ctx.drawImage(jdt.jdt01,pbX,pbY,pbW,pbH);
  }else{
    ctx.fillStyle='#333';ctx.fillRect(pbX,pbY,pbW,pbH);
  }
  // jdt02进度填充（从左边向右展开）
  var fillW=pbW*ls.progress;
  if(fillW>0){
    ctx.save();
    ctx.beginPath();ctx.rect(pbX,pbY,fillW,pbH);ctx.clip();
    if(jdt.jdt02&&jdt.jdt02.complete&&jdt.jdt02.naturalWidth>0){
      ctx.drawImage(jdt.jdt02,pbX,pbY,pbW,pbH);
    }else{
      ctx.fillStyle='#5de8c4';ctx.fillRect(pbX,pbY,fillW,pbH);
    }
    ctx.restore();
  }
  // jdt_icon01放在jdt02填充部分的最右边，底边与进度条底边对齐
  if(fillW>10){
    var iconX=pbX+fillW-iconW/2;
    var iconY=pbY+pbH-iconH;
    if(jdt.jdt_icon01&&jdt.jdt_icon01.complete&&jdt.jdt_icon01.naturalWidth>0){
      ctx.drawImage(jdt.jdt_icon01,iconX,iconY,iconW,iconH);
    }
  }
  ctx.restore(); // 恢复ctx状态
}

function draw(){
  // 加载阶段只渲染加载页
  if(G.phase==='loading'){drawLoading();return;}
  var p=G.p;
  var sx=shake>0?(Math.random()-0.5)*shake*2.5:0,sy=sx;
  ctx.save();ctx.translate(sx,sy);
  // 绘制背景
  var bgImg=loadBG(G.room+1);
  if(bgImg&&bgImg.complete&&bgImg.naturalWidth>0){
    ctx.drawImage(bgImg,0,0,W,H);
  }else{
    // 背景未加载，显示纯色背景
    ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  }
  if(G.showDoor&&G.doorX!==undefined){
    // ★ 新传送门系统 (CSM01 + CSM02)
    var dcx=G.doorX*TILE+TILE/2;
    var dcy=G.doorY*TILE+TILE/2;
    var csm01Img=getSpriteFrame('door_csm01',1);
    if(csm01Img){
      ctx.drawImage(csm01Img,dcx-128,dcy-128,256,256);
    }else{
      // 降级：闪烁方块
      var blink=Math.floor(frame/15)%2===0;
      ctx.fillStyle=blink?'#5de8c4':'#1a6a5a';
      ctx.fillRect(G.doorX*TILE,G.doorY*TILE,TILE,TILE);
    }
    G._doorCX=dcx;G._doorCY=dcy; // 缓存给后层渲染用
  }

  // 绘制地图上的浮动技能动画
  floatingSkills.forEach(function(fs){
    ensureSprite(fs.animName);
    var fsp=SPRITES[fs.animName];
    if(fsp&&fsp.frames.length){
      fsp.timer++;
      var _tickI=60/fsp.fps;
      if(fsp.timer>=_tickI){fsp.timer=0;fsp.frame=(fsp.frame+1)%fsp.frames.length;}
      var fimg=fsp.frames[fsp.frame];
      if(fimg&&fimg.complete&&fimg.naturalWidth>0){
        var breathe=1+Math.sin(frame*0.08)*0.1;
        var fsz=128*breathe;
        ctx.globalAlpha=0.85;
        ctx.drawImage(fimg,fs.x-fsz/2,fs.y-fsz/2,fsz,fsz);
        ctx.globalAlpha=1;
      }
    }
  });

  G.enemies.forEach(function(e){
    if(e.dying>0){
      // 死亡特效：根据倒计时计算帧索引（6帧动画，dying=20→0）
      ensureSprite('monster_death');
      var deathSp=SPRITES['monster_death'];
      if(deathSp&&deathSp.frames.length){
        var deathIdx=Math.min(Math.floor((20-e.dying)/(20/deathSp.frames.length)),deathSp.frames.length-1);
        var df=deathSp.frames[deathIdx];
        if(df&&df.complete&&df.naturalWidth>0){
          ctx.drawImage(df,e.x-128,e.y-128,256,256);
        }
      }
    }else{
      ctx.globalAlpha=1;
      var img=getSpriteFrame(e.type+'_'+e.state);
      if(img){
        ctx.save();
        ctx.translate(e.x,e.y);
        if(e.facingRight)ctx.scale(-1,1);
        ctx.drawImage(img,-64,-64,128,128);
        ctx.restore();
      }
      else{ctx.fillStyle=e.ht>0?'#fff':e.col;ctx.beginPath();ctx.arc(e.x,e.y,64,0,Math.PI*2);ctx.fill();}
      ctx.globalAlpha=1;
      // 怪物血条（在128x128精灵上方居中显示）
      var pct=e.hp/e.maxHp;
      ctx.fillStyle='#333';ctx.fillRect(e.x-32,e.y-72,64,4);
      ctx.fillStyle=pct>0.5?'#40c040':'#e04040';ctx.fillRect(e.x-32,e.y-72,64*pct,4);
    }
  });
  // 绘制Boss（存活或死亡动画），尺寸固定256x256px
  if(G.boss){
    var b=G.boss;
    var bossState=b.dead?'dead':(b.state||'idle');
    var img=getBossFrame(b,bossState);
    if(img){
      var sz=256;
      ctx.save();
      ctx.translate(b.x,b.y);
      // Boss精灵默认朝左，玩家在右边时水平翻转
      if(b.facingRight){ctx.scale(-1,1);}
      ctx.drawImage(img,-sz/2,-sz/2,sz,sz);
      ctx.restore();
    }else{
      // 精灵未加载时不绘制（避免白/红色大圆圈占位）
    }
    // BOSS血条 - 仅存活时显示
    if(!b.dead){
      var pct=b.hp/b.maxHp;
      ctx.fillStyle='#550000';ctx.fillRect(b.x-128,b.y-150,256,8);
      ctx.fillStyle='#ff3030';ctx.fillRect(b.x-128,b.y-150,256*pct,8);
      ctx.fillStyle='#ff6060';ctx.font='bold 11px Courier New';ctx.textAlign='center';
      ctx.fillText('BOSS '+b.hp+'/'+b.maxHp,b.x,b.y-162);
    }
  }

  if(p){
    // ▶ 精灵选择 & 翻转(受击击退动画优先)
    var pSpriteName;
    if(p.missAnimT>0){
      pSpriteName='player_miss';
    }else{
      pSpriteName='player_'+p.state;
      if(p.state==='idle'&&(Math.abs(p.vx)>0.1||Math.abs(p.vy)>0.1)){
        pSpriteName='player_right';
      }
    }
    // 仅 player_right 原生朝右 → 须在 facingRight=false 时翻转
    // 其余精灵 (idle/attack/hit/miss) 都原生朝左 → 须在 facingRight=true 时翻转
    var doFlip=(pSpriteName==='player_right')?!p.facingRight:p.facingRight;

    var img=getSpriteFrame(pSpriteName,p.animSpeedMult||1);
    if(img){
      ctx.save();
      ctx.translate(p.x,p.y);
      // 传送门开启时：角色缩到5%+透明到5%
      if(G.doorState==='opening'&&p._doorProgress!==undefined){
        var _dp=p._doorProgress;
        var _ds=1-_dp*0.95; // 100%→5%
        ctx.globalAlpha=_ds;
        ctx.scale(_ds,_ds);
      }
      if(doFlip){ctx.scale(-1,1);}
      ctx.drawImage(img,-128,-128,256,256);
      // ★ 玩家攻击特效（VFX在save/restore内，随角色翻转自动镜像）
      if(p.atkT>0){ensureSprite('player_attack_fx');var _fxSp=SPRITES['player_attack_fx'];if(_fxSp){var _fxIdx=Math.min(Math.floor((30-p.atkT)/2.5),_fxSp.frames.length-1);var _fxImg=_fxSp.frames[_fxIdx];if(_fxImg&&_fxImg.complete&&_fxImg.naturalWidth>0)ctx.drawImage(_fxImg,-198,-120,256,256);}}
      ctx.restore();
      // 大招VFX渲染（在玩家位置+5px水平偏移）
      if(ultimateVFX){
        var uv=ultimateVFX;
        var uvAnimName='ult_'+uv.skillType;
        ensureSprite(uvAnimName);
        var uvSp=SPRITES[uvAnimName];

// 升级特效动画绘制
function drawLevelUpEffect(){
  if(!LVUP_ANIM)return;
  var anim=LVUP_ANIM;
  var elapsed=frame-anim.start;
  if(elapsed>=anim.duration||elapsed<0){
    LVUP_ANIM=null;
    return;
  }
  var fi=Math.floor(elapsed/anim.frameInterval);
  if(fi>=22)return;
  var frames=JSSX_IMAGES.sjtx_frames;
  var fimg=frames[fi];
  if(fimg&&fimg.complete&&fimg.naturalWidth>0){
    var fw=anim.w, fh=anim.h;
    ctx.drawImage(fimg,anim.x,anim.y,fw,fh);
  }
}
// 升级逻辑
function levelUp(count){
  var p=G.p;if(!p)return;
  var pg=GAME_CONFIG&&GAME_CONFIG.playerGrowth;
  if(!pg)return;
  var lvIdx=Math.min(p.lv-1,pg.data.length-1);
  var row=pg.data[lvIdx];
  if(!row)return;
  var cost=_use10xMode?row[5]*10:row[5];
  if(p.expTotal<cost)return;
  // 消耗经验
  p.expTotal-=cost;playSound('upgrade');
  // 逐级升级
  var targetLv=p.lv+count;
  if(targetLv>pg.data.length)targetLv=pg.data.length;
  var oldMaxHp=p.maxHp;
  var targetIdx=Math.min(targetLv-1,pg.data.length-1);
  var targetRow=pg.data[targetIdx];
  if(!targetRow)return;
  var newMaxHp=targetRow[3];
  p.maxHp=newMaxHp;
  p.hp=Math.round(p.hp*newMaxHp/oldMaxHp);
  p.lv=targetLv;
  // 播放升级特效（组JSSX右边距123px, 底边距257px）
  var animX=1476-123-619+90; // 右边缘对齐减去宽度，再右移90px
  var animY=952-257-258;  // 底边缘对齐减去高度
  LVUP_ANIM={
    start:frame,
    duration:22*4, // 22帧, 每帧4个游戏循环
    frameInterval:4,
    x:animX,
    y:animY,
    w:619,
    h:258
  };
  tickUI();
  // 刷新HUD经验显示立即更新
}

function tick(now){
  try {
    // 固定时间步长累加器：确保游戏逻辑始终以60fps运行
    // 首次调用（init直接调用无参/rAF首次回调）初始化时间基准
    if(!now){requestAnimationFrame(tick);return;}
    if(lastTime===0)lastTime=now;
    var elapsed=Math.min(now-lastTime,100); // 防止长时间暂停后逻辑爆炸
    lastTime=now;
    accumulator+=elapsed;

    while(accumulator>=FIXED_STEP){
      accumulator-=FIXED_STEP;

      // === 固定60fps：游戏逻辑 ===
      frame++;
      if(G.phase==='playing'&&!G.showAttrUI){
        // 初始保护延迟：等待精灵加载完成再生成怪物
        if(G._spawnDelay>0){G._spawnDelay--;}
        var p=G.p;
        var cfg=ROOM_CFG[G.room];
        if(p&&G.enemies.length<25&&G.monsterQueue&&G.monsterQueue.length>0&&G._spawnDelay<=0){
          spawnTimer++;
          if(spawnTimer>=cfg.spawnInt){
            spawnTimer=0;
            var cnt=Math.min(cfg.spawnMin+Math.floor(Math.random()*(cfg.spawnMax-cfg.spawnMin+1)),G.monsterQueue.length);
            for(var i=0;i<cnt;i++){addEnemyOne(G.monsterQueue.pop());}
            }
        }
        if(G.monsterQueue&&G.monsterQueue.length===0){G.allSpawned=true;}
        // Boss生成逻辑：根据房间配置的bossScore和当前boss资源
        if(cfg.bossScore>0&&p&&p.score>=cfg.bossScore&&!G.boss){
          var bossCfg=getBossConfig(G.room);
          // Boss生成位置：玩家右侧100~400px，角度-45°~45°（与怪物出生逻辑一致）
          var _bAngle=(Math.random()-0.5)*Math.PI/2;
          var _bDist=100+Math.random()*300;
          var _bTx=(G.p.x+Math.cos(_bAngle)*_bDist)/TILE;
          var _bTy=(G.p.y+Math.sin(_bAngle)*_bDist)/TILE;
          G.boss={
            x:_bTx*TILE+TILE/2,y:_bTy*TILE+TILE/2,
            hp:bossCfg.hp,maxHp:bossCfg.hp,
            dead:false,dying:0,
            cd:bossCfg.cd,cdMax:bossCfg.cd,
            state:'idle',
            sz:bossCfg.sz,dmg:bossCfg.dmg,
            spd:bossCfg.spd,bullets:bossCfg.bullets,
            ht:0,animTimer:0
          };
          addFText(W/2,H/2,'BOSS出现!','#ff3030');
        }

        // 普通关：所有怪物清空后出现传送门（boss房不显示）
        if(cfg.bossScore===0&&G.monsterQueue&&G.monsterQueue.length===0&&G.monstersAlive<=0&&!G.doorActive){
          G.doorActive=true;G.showDoor=true;G.doorState='idle';
          G.doorX=Math.floor(W/TILE/2);G.doorY=Math.floor(H/TILE/2);
          addFText(W/2,H/2,'门出现!','#5de8c4');
        }

        // ★ 传送门传送逻辑 (CSM01 idle → CSM02 opening → 5s → goRoom)
        if(G.showDoor&&p&&G.doorX!==undefined){
          var dcx=G.doorX*TILE+TILE/2,dcy=G.doorY*TILE+TILE/2;
          if(G.doorState==='idle'&&Math.hypot(p.x-dcx,p.y-dcy)<70){
            if(!G.doorDelay){G.doorDelay=0;}
            G.doorDelay++;
            if(G.doorDelay>=30){
              G.doorState='opening';G.doorTimer=300;G.doorDelay=0;
              // 预加载下一关背景，利用5秒传送时间下载
              loadBG(G.room+2);
              if(p){G._doorPlayerStartX=p.x;G._doorPlayerStartY=p.y;}
              G._doorCenterX=dcx;G._doorCenterY=dcy;
              ensureSprite('door_csm02');var sp2=SPRITES['door_csm02'];if(sp2){sp2.frame=0;sp2.timer=0;}
              addFText(W/2,H/2,'传送门已启动!','#f5c518');
              try{G.doorAudio=new Audio('audio/chuanshongmen/csm01.MP3');G.doorAudio.loop=true;G.doorAudio.volume=0.6;G.doorAudio.play();}catch(e){}
            }
          }else if(G.doorState==='idle'&&G.doorDelay>0){
            G.doorDelay=0;
          }
        }
        if(G.doorState==='opening'){
          G.doorTimer--;
          if(G.doorTimer<=0){goRoom(G.room+1);}
        }
        tickPlayer();tickE();tickProjs();tickParts();tickFlyIcons();tickUltimateVFX();tickUI();tickBattlePass();
        // 经验值累积系统
        if(p&&GAME_CONFIG&&GAME_CONFIG.playerGrowth){
          var lvIdx=Math.min(p.lv-1,GAME_CONFIG.playerGrowth.data.length-1);
          var row=GAME_CONFIG.playerGrowth.data[lvIdx];
          if(row&&G.lastKillFrame!==undefined&&frame-G.lastKillFrame<120){
            p.expAccum+=row[4]/60;
            if(p.expAccum>=50&&!G.expFly){
              p.expAccum-=50;
              p.expTotal+=50;
              startExpFlyAnimation();
            }
          }
        }
      }
      // 屏幕震动衰减移至固定时间步长
      if(shake>0)shake=Math.max(0,shake-0.4);
    }

    if(G.phase==='loading'&&loadingState){
      updateLoadProgress();
      // 要求：精灵全部就绪 + QDY首张背景加载完成 + 最小显示800ms
      var qdyReady=QDY_IMAGES&&QDY_IMAGES[0]&&QDY_IMAGES[0].complete&&QDY_IMAGES[0].naturalWidth>0;
      var allLoad=loadingState.progress>=1&&qdyReady;
      if(allLoad&&Date.now()-loadingState.startTime>500){
        // 去掉菜单页：加载完成后直接进入游戏
        loadingState=null;
        startGame(0, true);
        console.log('加载完成，直接进入游戏');
      }
    }

    // === 按显示器刷新率：渲染 ===
    if(G.phase==='playing'||G.phase==='dead'||G.phase==='win'||G.phase==='loading')draw();
    // 结算界面倒计时提示
    if((G.phase==='dead'||G.phase==='win')&&G.endFrame){
      var elapsedTotal=(frame-G.endFrame)/60;
      var remaining=Math.ceil(3-elapsedTotal);
      if(remaining>0){
        ctx.fillStyle='rgba(0,0,0,0.5)';
        ctx.fillRect(0,H-40,W,40);
        ctx.fillStyle='#fff';ctx.font='bold 16px Courier New';ctx.textAlign='center';
        ctx.fillText(remaining+'秒后可操作...',W/2,H-15);
      }
    }
    requestAnimationFrame(tick);
  } catch(e) {
    console.error('Game tick error:', e, e.stack);
    // 继续运行，即使出现错误
    requestAnimationFrame(tick);
  }
}

function goRoom(nextRoom){
  var score=G.p?G.p.score:0;
  var hp=G.p?G.p.hp:150;
  var pots=G.p?G.p.pots:3;
  G.room=Math.min(nextRoom,TOTAL_ROOMS-1);
  updateBattlePass(G.room);
  G.phase='playing';G.map=makeMap();G.showDoor=false;G.doorActive=false;G.doorState=null;G.kills=0;G.roomScore=0;G.expFly=null;G.monsterQueue=null;G.totalMonsters=0;G.monstersAlive=0;G.allSpawned=false;
  if(G.doorAudio){try{G.doorAudio.pause();G.doorAudio=null;}catch(e){}}
  hideOverlay();
  loadBG(G.room+1);
  spawnRoom();
  if(!G.p)G.p=mkPlayer();
  G.p.score=score;G.p.hp=hp;G.p.pots=pots;G.p.x=640;G.p.y=540;G.p.vx=0;G.p.vy=0;G.p.state='idle';
  WPNS=WPNS_PER_ROOM[G.room].map(function(w){return Object.assign({},w);});
  flyIcons=[];ultimateVFX=null;
  spawnFloatingSkills();
  tickUI();
  if(typeof TAPDB!=='undefined')TAPDB.track('game_level',{room:G.room,roomName:G.room+1});
}

function getRoundStartRoom(room){
  // 每3关一回合，返回当前回合的起始房间号
  return Math.floor(room/3)*3;
}

// 浮动技能动画名映射
var FLOAT_ANIM_MAP={huogong:'float_huogong',leidian:'float_leidian',longjuanfeng:'float_longjuanfeng',yuancheng:'float_yuancheng'};

function spawnFloatingSkills(){
  floatingSkills=[];
  var roundIdx=Math.floor(G.room/3);
  if(!G_roundSkillRooms||G_roundSkillRooms._round!==roundIdx){
    // 新回合：随机选2个房间放浮动技能（不能同一关卡）
    var rooms=[roundIdx*3,roundIdx*3+1,roundIdx*3+2];
    var picked=[];
    var r1=rooms[Math.floor(Math.random()*3)];
    picked.push(r1);
    var remaining=rooms.filter(function(r){return r!==r1;});
    var r2=remaining[Math.floor(Math.random()*2)];
    picked.push(r2);
    G_roundSkillRooms={_round:roundIdx,rooms:picked};
  }
  // 当前房间是否应该放置浮动技能
  if(G_roundSkillRooms.rooms.indexOf(G.room)===-1)return;
  // 放置2个浮动技能动画，彼此距离>100px
  var _fxs=[];
  for(var k=0;k<2;k++){
    var fx,fy;
    for(var attempt=0;attempt<20;attempt++){
      var baseAngle=G.p.facing>0?0:Math.PI;
      fx=G.p.x+Math.cos(baseAngle+(Math.random()*30-15)*Math.PI/180)*(50+Math.random()*450);
      fy=G.p.y+Math.sin(baseAngle+(Math.random()*30-15)*Math.PI/180)*(50+Math.random()*450);
      fx=Math.max(128,Math.min(W-128,fx));
      fy=Math.max(128,Math.min(H-128,fy));
      if(_fxs.length===0||Math.hypot(fx-_fxs[0].x,fy-_fxs[0].y)>100)break;
    }
    _fxs.push({x:fx,y:fy});
    var skillType=SKILL_TYPES[Math.floor(Math.random()*4)];
    var _fAnim=FLOAT_ANIM_MAP[skillType];
    ensureSprite(_fAnim);
    floatingSkills.push({x:fx,y:fy,skillType:skillType,animName:_fAnim,timer:0});
  }
}

function startGame(startRoom, clearDazhao, showDeathPopup){
  startRoom=startRoom||0;
  // 跨回合保留dazhao槽位技能（死亡时清零，通关时保留）
  var savedDazhao=!clearDazhao?dazhaoSlots:{dazhao01:null,dazhao02:null,dazhao03:null,dazhao04:null};
  if(clearDazhao){
    var _dzKeys=['dazhao01','dazhao02','dazhao03','dazhao04'];
    _dzKeys.forEach(function(k){
      var _ic=document.getElementById(k+'-icon');
      if(_ic){_ic.style.display='none';_ic.src='';}
    });
  }
  if(G&&G.doorAudio){try{G.doorAudio.pause();}catch(e){}}
  G={phase:'playing',room:startRoom,map:makeMap(),enemies:[],kills:0,expFly:null,showAttrUI:false,monsterQueue:null,totalMonsters:0,monstersAlive:0,allSpawned:false,lastKillFrame:0,p:null};
  G.p=mkPlayer();
  // 3秒无敌保护：防止加载未完成时被怪打死
  G.p.invT=180;
  G._spawnDelay=120; // 头2秒不生成怪物
  floatingSkills=[];dazhaoSlots=savedDazhao;flyIcons=[];ultimateVFX=null;G_roundSkillRooms=null;
  loadBG(startRoom+1);
  WPNS=WPNS_PER_ROOM[startRoom].map(function(w){return Object.assign({},w);});
  spawnRoom();spawnFloatingSkills();tickUI();startBGM();
  BP.prevSlots=null;updateBattlePass(G.room);
  hideOverlay();
  // 进入游戏：显示虚拟控制器（移动端）
  if(window.IS_MOBILE_DEVICE){
    var vc=document.getElementById('vctrl');
    if(vc)vc.style.display='block';
  }
  // 死亡回退弹框：hideOverlay后200ms出生
  if(showDeathPopup){
    var _oldRound=Math.floor(startRoom/3);
    var _chName=CHAPTER_NAMES[_oldRound]||'XX';
    deathPopupAnim={startTime:Date.now()+200,chapterName:_chName,retryLevel:startRoom+1};
  }
  if(typeof TAPDB!=='undefined')TAPDB.track('game_start',{room:startRoom,roomName:startRoom+1});
}

document.addEventListener('keydown',function(e){
  keys[e.code]=true;
  // 死亡/胜利界面：按键进入下一阶段
  if(G.phase==='dead'||G.phase==='win'){
    var elapsed=G.endFrame?(frame-G.endFrame)/60:999;
    if(elapsed<3)return;
    startBGM();
    if(G.phase==='dead'){
      var roundStart=getRoundStartRoom(G.room);
      startGame(roundStart, true, true);
    }else if(G.phase==='win'){
      if(G.room>=TOTAL_ROOMS-1){
        startGame(0, true);
      }else{
        var nextRoundStart=getRoundStartRoom(G.room+1);
        startGame(nextRoundStart);
      }
    }
    return;
  }
  if(e.code==='Space'||e.code==='KeyZ'){e.preventDefault();doAttack();}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyX'){e.preventDefault();doRoll();}
  if(e.code==='Digit1'){if(G.p)G.p.wpn=0;}
  if(e.code==='Digit2'){if(G.p)G.p.wpn=1;}
  if(e.code==='Digit3'){if(G.p)G.p.wpn=2;}
  if(e.code==='KeyQ'){usePotion();}
});
document.addEventListener('keyup',function(e){keys[e.code]=false;});

// 首次交互兜底：BGM被浏览器拦截后，在第一次点击/触摸时恢复；同时请求全屏
var _bgmFirstGestureHandled=false;
function tryResumeBGMOnGesture(){
  startBGM();
  // 首次手势请求全屏（仅在非全屏状态时）
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    var elem=document.documentElement;
    try{
      if(elem.requestFullscreen)elem.requestFullscreen();
      else if(elem.webkitRequestFullscreen)elem.webkitRequestFullscreen();
    }catch(e){}
  }
  if(!_bgmFirstGestureHandled)_bgmFirstGestureHandled=true;
}

// 二次贝塞尔曲线点计算
function bezierPt(t, p0, p1, p2) {
  var u = 1 - t;
  return {
    x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
    y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y
  };
}

// 标准三次贝塞尔缓动求解
function cubicBezier(t,p1x,p1y,p2x,p2y){
  var lo=0,hi=1,mid,x;
  for(var i=0;i<12;i++){
    mid=(lo+hi)/2;
    var m2=mid*mid,m3=m2*mid;
    x=3*p1x*mid*(1-mid)*(1-mid)+3*p2x*m2*(1-mid)+m3;
    if(x<t)lo=mid;else hi=mid;
  }
  mid=(lo+hi)/2;
  var m2=mid*mid,m3=m2*mid;
  return 3*p1y*mid*(1-mid)*(1-mid)+3*p2y*m2*(1-mid)+m3;
}

// 飞行速度曲线：cubic-bezier(0.25, 0.1, 0.25, 1) 近似
function flightEasing(t) {

  return t * (1.5 - 0.5 * t);

// ============== 弹出动画 ==============
function animatePop(el, endScale, callback) {
  // 确保起始状态
  el.style.transition = 'none';
  el.style.transform = 'scale(1)';
  // 强制回流
  void el.offsetWidth;

  // Phase 1: 蓄力缩小 1.0 → 0.82 (60ms ease-in)
  el.style.transition = 'transform 60ms ease-in';
  el.style.transform = 'scale(0.82)';

  setTimeout(function() {
    // Phase 2: Q弹弹出 0.82 → endScale (100ms cubic-bezier)
    el.style.transition = 'transform 100ms cubic-bezier(0.34, 1.56, 0.64, 1)';
    el.style.transform = 'scale(' + endScale + ')';

    setTimeout(function() {
      callback();
    }, 100);
  }, 60);
}

// ============== 弧线飞行动画（overlay 视口坐标系） ==============
function startFlight(icon, bodyScreenH, callback) {
  var el = icon.el;
  var fromCenter = {
    x: icon.srcRect.left + icon.srcRect.width / 2,
    y: icon.srcRect.top + icon.srcRect.height / 2
  };
  var toCenter = icon.targetCenter;

  // 二次贝塞尔控制点：上方 + 横向偏移
  var midX = (fromCenter.x + toCenter.x) / 2;
  var midY = Math.min(fromCenter.y, toCenter.y);
  var dist = Math.abs(toCenter.x - fromCenter.x);
  var arcH = bodyScreenH * icon.arcHeight;

  var cp = {
    x: midX + dist * icon.arcOffsetX,
    y: midY - arcH
  };

  var startTime = performance.now();
  var dur = icon.flightDur;
  var startScale = icon.popEndScale;
  var endScale = icon.flightEndScale;
  var rotation = icon.rotation;

  // 药水特殊：透明度渐变 (1.0→0.85→1.0) 和后半段模糊
  var isPotion = icon.blur;

  function frame() {
    var elapsed = performance.now() - startTime;
    var rawT = Math.min(elapsed / dur, 1);
    var t = flightEasing(rawT);

    var pos = bezierPt(t, fromCenter, cp, toCenter);

    // 缩放插值
    var scale = startScale + (endScale - startScale) * rawT;

    // 旋转（单向旋转）
    var angle = rotation * rawT;

    // 透明度：药水特殊处理
    var opacity = 1;
    if (isPotion) {
      if (rawT < 0.5) opacity = 1 - 0.15 * (rawT / 0.5);
      else opacity = 0.85 + 0.15 * ((rawT - 0.5) / 0.5);
    }

    // 模糊：药水在70%后叠加模糊
    var filter = '';
    if (isPotion && rawT > 0.7) {
      var blurStrength = Math.sin((rawT - 0.7) / 0.3 * Math.PI) * 1.0;
      filter = 'blur(' + blurStrength.toFixed(1) + 'px)';
    }

    el.style.left = (pos.x - icon.w / 2) + 'px';
    el.style.top = (pos.y - icon.h / 2) + 'px';
    el.style.transform = 'scale(' + scale.toFixed(4) + ') rotate(' + angle.toFixed(1) + 'deg)';
    el.style.opacity = opacity;
    el.style.filter = filter;

    if (rawT < 1) {
      requestAnimationFrame(frame);
    } else {
      // 确保最终位置精确
      el.style.left = (toCenter.x - icon.w / 2 * endScale) + 'px';
      el.style.top = (toCenter.y - icon.h / 2 * endScale) + 'px';
      el.style.transform = 'scale(' + endScale + ') rotate(' + rotation + 'deg)';
      el.style.opacity = 1;
      el.style.filter = '';
      callback();
    }
  }

  // 确保从弹出结束状态开始飞行
  el.style.transition = 'none';
  requestAnimationFrame(frame);
}

// ============== 落点弹跳 + 光晕 + 数值 ==============
function animateTargetLanding(targetEl, value, overlay) {
  // 目标元素视口坐标（与 overlay 坐标系一致）
  var rect = targetEl.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;

  // 1. 目标弹性缩放 (380ms)
  targetEl.style.transition = 'none';
  targetEl.style.transform = 'scale(1.3)';
  // 强制回流
  void targetEl.offsetWidth;

  var bounceSteps = [
    { time: 0, scale: '1.3' },
    { time: 130, scale: '0.88' },
    { time: 250, scale: '1.04' },
    { time: 380, scale: '1.0' }
  ];
  bounceSteps.forEach(function(step) {
    setTimeout(function() {
      targetEl.style.transition = 'transform 100ms cubic-bezier(0.68, -0.55, 0.27, 1.55)';
      targetEl.style.transform = 'scale(' + step.scale + ')';
    }, step.time);
  });

  // 2. 光晕扩散（overlay 视口坐标系），半径 0 → 28px
  var glow = document.createElement('div');
  glow.className = 'landing-glow';
  glow.style.cssText = [
    'position:absolute',
    'pointer-events:none',
    'left:' + cx + 'px',
    'top:' + cy + 'px',
    'width:0px',
    'height:0px',
    'border-radius:50%',
    'background:radial-gradient(circle, rgba(255,215,0,0.7), rgba(255,215,0,0.1) 60%, transparent)',
    'z-index:10000',
    'opacity:0.7',
    'transform:translate(-50%,-50%)',
    'transition:all 300ms ease-out'
  ].join(';');
  overlay.appendChild(glow);

  requestAnimationFrame(function() {
    glow.style.width = '56px';
    glow.style.height = '56px';
    glow.style.opacity = '0';
  });
  setTimeout(function() {
    try { overlay.removeChild(glow); } catch(e) {}
  }, 350);

  // 3. 数值跳动 +N（overlay 视口坐标系）
  var valEl = document.createElement('div');
  valEl.className = 'landing-value';
  valEl.textContent = '+' + value;
  valEl.style.cssText = [
    'position:absolute',
    'pointer-events:none',
    'left:' + cx + 'px',
    'top:' + cy + 'px',
    'transform:translateX(-50%)',
    'color:#ffd700',
    'font:bold 18px Courier New',
    'z-index:10000',
    'opacity:1',
    'transition:all 400ms ease-out',
    'text-shadow:0 0 6px rgba(255,215,0,0.8)'
  ].join(';');
  overlay.appendChild(valEl);

  requestAnimationFrame(function() {
    valEl.style.transform = 'translateX(-50%) translateY(-14px)';
    valEl.style.opacity = '0';
  });
  setTimeout(function() {
    try { overlay.removeChild(valEl); } catch(e) {}
  }, 450);
}

// 将屏幕坐标转换为画布像素坐标（兼容竖屏旋转）
function screenToCanvas(clientX,clientY){
  var rect=canvas.getBoundingClientRect();
  var vx=clientX-rect.left,vy=clientY-rect.top;
  if(window.screenAdapter&&window.screenAdapter.isMobile&&window.screenAdapter.isMobile()&&window.screenAdapter.isPortrait()){
    // 竖屏旋转：body rotate(90deg)，视觉宽↔画布高，视觉高↔画布宽
    return{x:vy*(W/rect.height),y:(rect.width-vx)*(H/rect.width)};
  }
  return{x:vx*(W/rect.width),y:vy*(H/rect.height)};
}

canvas.addEventListener('touchstart',function(e){
  e.preventDefault();
  var t=e.touches[0];var rect=canvas.getBoundingClientRect();
  // 保存画布像素坐标用于属性UI点击检测
  var sc=screenToCanvas(t.clientX,t.clientY);
  G._tapCx=sc.x;G._tapCy=sc.y;
  // 升级按钮按下检测
  handleAttrUIPress(sc.x,sc.y);
  if(window.screenAdapter){
    var coords=window.screenAdapter.transformTouchCoords(t.clientX,t.clientY,rect,W,H);
    touch.x=coords.x;
    touch.y=coords.y;
  }else{
    var ratio=rect.width/W;
    touch.x=(t.clientX-rect.left-rect.width/2)/(50*ratio);
    touch.y=(t.clientY-rect.top-rect.height/2)/(50*ratio);
  }
},{passive:false});
canvas.addEventListener('touchend',function(e){
  if(G._tapCx!==undefined&&G._tapCy!==undefined){
    handleAttrUIClick(G._tapCx,G._tapCy);
    G._tapCx=undefined;G._tapCy=undefined;

},{passive:false});

canvas.addEventListener('mousedown',function(e){

var ATTR_UI_ANIM=null; // {type:'open'|'close', start:Date.now()}
var _selectedMode='s1j'; // 's1j'或's10j' — 持久化的按钮选中状态

// 按钮弹跳动画
var BTN_BOUNCE=null; // {key:'s1j'|'s10j', start:frame}
var BOUNCE_DURATION=20; // 帧数
var BOUNCE_KF=[
  {t:0,   dy:0,  sx:1,   sy:1},
  {t:0.20,dy:-18,sx:0.85,sy:1.15},
  {t:0.40,dy:0,  sx:1.15,sy:0.85},
  {t:0.55,dy:-10,sx:0.92,sy:1.08},
  {t:0.70,dy:0,  sx:1.08,sy:0.92},
  {t:0.82,dy:-4, sx:0.97,sy:1.03},
  {t:0.92,dy:0,  sx:1.02,sy:0.98},
  {t:1,   dy:0,  sx:1,   sy:1}
];
function cubicBezierSolve(t,p1x,p1y,p2x,p2y){
  var g=t;
  for(var i=0;i<8;i++){
    var x=3*(1-g)*(1-g)*g*p1x+3*(1-g)*g*g*p2x+g*g*g;
    var dx=3*(1-g)*(1-g)*p1x+6*(1-g)*g*(p2x-p1x)+3*g*g*(1-p2x);
    if(Math.abs(x-t)<0.0001)break;
    g-=(x-t)/dx;
  }
  return 3*(1-g)*(1-g)*g*p1y+3*(1-g)*g*g*p2y+g*g*g;
}
function getBounceTransform(progress){
  var eased=cubicBezierSolve(progress,0.36,0.07,0.19,0.97);
  for(var i=0;i<BOUNCE_KF.length-1;i++){
    var a=BOUNCE_KF[i],b=BOUNCE_KF[i+1];
    if(eased>=a.t&&eased<=b.t){
      var seg=(eased-a.t)/(b.t-a.t);
      return{dy:a.dy+(b.dy-a.dy)*seg,sx:a.sx+(b.sx-a.sx)*seg,sy:a.sy+(b.sy-a.sy)*seg};
    }
  }
  return{dy:0,sx:1,sy:1};
}

// 升级按钮选中切换（持久状态）
function handleAttrUIPress(cx,cy){
  if(!G.showAttrUI||ATTR_UI_ANIM)return;
  // s1j 按钮区域
  if(cx>=932&&cx<=1133&&cy>=838&&cy<=910){
    _selectedMode='s1j';_use10xMode=false;
    BTN_BOUNCE={key:'s1j',start:frame};
    return;
  }
  // s10j 按钮区域（需检查是否有足够经验升10级）
  if(cx>=1163&&cx<=1364&&cy>=838&&cy<=910){
    var pg=GAME_CONFIG&&GAME_CONFIG.playerGrowth;
    var p=G.p;
    if(pg&&p){
      var lvIdx=Math.min(p.lv-1,pg.data.length-1);
      var row=pg.data[lvIdx];
      if(row&&p.expTotal>=row[5]*10){
        _selectedMode='s10j';_use10xMode=true;
        BTN_BOUNCE={key:'s10j',start:frame};
        return;
      }
    }
  }
}
function handleAttrUIClick(cx,cy){
  if(G.showAttrUI){
    // 关闭按钮区域
    var btR=341+1135+25;
    var btL=btR-130;
    var btT=131+40;
    var btB=btT+130;
    if(cx>=btL&&cx<=btR&&cy>=btT&&cy<=btB){
      setAttrUI(false);
      return true;
    }
    // s1j 升1级按钮
    if(cx>=932&&cx<=1133&&cy>=838&&cy<=910){
      levelUp(1);
      return true;
    }
    // s10j 升10级按钮
    if(cx>=1163&&cx<=1364&&cy>=838&&cy<=910){
      var _pg=GAME_CONFIG&&GAME_CONFIG.playerGrowth;
      var _p=G.p;
      if(_pg&&_p){
        var _idx=Math.min(_p.lv-1,_pg.data.length-1);
        var _rw=_pg.data[_idx];
        if(_rw&&_p.expTotal>=_rw[5]*10)levelUp(10);
      }
      return true;
    }
    return true; // UI打开时阻止操作穿透
  }
  if(G.phase==='playing'&&G.p){
    // 属性按钮点击（区域 506,25 ~ 506+291, 25+61）
    if(cx>=506&&cx<=797&&cy>=25&&cy<=86){
      setAttrUI(true);
      return true;
    }
    var h=256;
    if(cx>=G.p.x-h&&cx<=G.p.x+h&&cy>=G.p.y-h&&cy<=G.p.y+h){
      setAttrUI(true);
      return true;
    }
  }
  return false;
}

// 构建预加载队列：只预加载当前房间实际需要的精灵，避免全量加载导致移动端内存溢出
function buildPreloadQueue(){
  var queue=[];
  // 玩家核心精灵
  ['player_idle','player_attack','player_hit','player_miss','player_right','player_attack_fx','player_left'].forEach(function(n){queue.push(n);});
  // 当前房间的敌人类型（从房间配置读取）
  var enemyTypes=ROOM_CFG&&ROOM_CFG[G.room]&&ROOM_CFG[G.room].types;
  if(enemyTypes&&enemyTypes.length){
    enemyTypes.forEach(function(t){['idle','attack','hit','miss'].forEach(function(s){queue.push(t+'_'+s);});});
  }else{
    // 兜底：房间配置缺失时预加载基础敌人
    ['slime','skel','ghost'].forEach(function(t){['idle','attack','hit','miss'].forEach(function(s){queue.push(t+'_'+s);});});
  }
  // 传送门
  queue.push('door_csm01');queue.push('door_csm02');queue.push('door_csm03');
  // 怪物死亡
  queue.push('monster_death');
  // 浮动技能
  ['float_huogong','float_leidian','float_longjuanfeng','float_yuancheng'].forEach(function(n){queue.push(n);});
  // 大招动画
  ['ult_huogong','ult_leidian','ult_longjuanfeng','ult_yuancheng'].forEach(function(n){queue.push(n);});
  // 氛围特效
  queue.push('fwtx_holylance');
  loadingState.queue=queue;
  loadingState.total=queue.length;
  // 计算总帧数（真实进度）
  var _tf=0;
  queue.forEach(function(n){if(SPRITE_DEFS[n])_tf+=SPRITE_DEFS[n].frames;});
  loadingState.totalFrames=_tf;
}

// 分批预加载，避免一次性创建太多Image导致浏览器卡死
function preloadNextBatch(){
  if(!loadingState||!loadingState.queue)return;
  var batchSize=2;
  var start=loadingState.qIdx;
  var end=Math.min(start+batchSize,loadingState.queue.length);
  for(var i=start;i<end;i++){ensureSprite(loadingState.queue[i]);}
  loadingState.qIdx=end;
  // 每200ms推进一批
  if(end<loadingState.queue.length){
    setTimeout(preloadNextBatch,100);
  }
  updateLoadProgress();
}

function updateLoadProgress(){
  if(!loadingState||!loadingState.queue)return;
  var total=loadingState.totalFrames||1;
  var ready=0;
  loadingState.queue.forEach(function(k){
    var sp=SPRITES[k];
    if(!sp)return;
    for(var i=0;i<sp.frames.length;i++){
      if(sp.frames[i]&&sp.frames[i].complete&&sp.frames[i].naturalWidth>0)ready++;
    }
  });
  loadingState.loaded=ready;
  loadingState.progress=Math.min(1,ready/total);
}

function triggerUltimate(slotId){
  if(G.phase!=='playing'||!G.p||ultimateVFX)return;
  var slot=dazhaoSlots[slotId];
  if(!slot)return;
  var skillType=slot.skillType;
  // 消耗槽位
  dazhaoSlots[slotId]=null;
  var iconEl=document.getElementById(slotId+'-icon');
  if(iconEl){iconEl.style.display='none';iconEl.src='';}
  // 触发大招VFX
  var totalFrames={huogong:23,leidian:37,longjuanfeng:25,yuancheng:15}[skillType]||23;
  ultimateVFX={skillType:skillType,frame:0,timer:0,totalFrames:totalFrames,facingRight:G.p.facingRight,x:G.p.x,y:G.p.y};
  // 范围伤害：对玩家周围TILE*5≈240px内的所有敌人造成其最大HP 50%伤害
  var ultRange=TILE*5;
  G.enemies.forEach(function(e){
    if(e.dead)return;
    var edx=e.x-G.p.x,edy=e.y-G.p.y;
    if(Math.hypot(edx,edy)<ultRange){
      var dmg=Math.round(e.maxHp*0.5);
      e.hp-=dmg;
      e.ht=12;e.state='hit';
      if(SPRITES[e.type+'_hit'])SPRITES[e.type+'_hit'].frame=0;
      addFText(e.x,e.y-28,'-'+dmg,'#ff8800');
      if(e.hp<=0){
        e.dead=true;e.dying=20;G.kills++;G.p.score+=e.sc;G.roomScore+=e.sc;G.lastKillFrame=frame;if(G.monstersAlive!==undefined)G.monstersAlive--;
        addFText(e.x,e.y-22,'+'+e.sc,'#ffd700');
      }
    }
  });
  // Boss也受伤害
  if(G.boss&&!G.boss.dead){
    var bdx=G.boss.x-G.p.x,bdy=G.boss.y-G.p.y;
    if(Math.hypot(bdx,bdy)<ultRange*1.5){
      var bDmg=Math.round(G.boss.maxHp?G.boss.maxHp*0.3:G.boss.hp*0.3);
      G.boss.hp-=bDmg;G.boss.ht=8;G.boss.state='hit';
      addFText(G.boss.x,G.boss.y-28,'-'+bDmg,'#ff8800');
      if(G.boss.hp<=0){dmgBoss(bDmg*2);}
    }
  }
  shake=Math.max(shake,10);
  // 播放对应大招音效
  var ultAudioMap={huogong:'audio/wanjia_gongji_dazhao/dazhao_huogong01/huogong.MP3',leidian:'audio/wanjia_gongji_dazhao/dazhao_leidian01/leidian.MP3',longjuanfeng:'audio/wanjia_gongji_dazhao/dazhao_longjuanfeng01/longjuanfeng.MP3',yuancheng:'audio/wanjia_gongji_dazhao/dazhao_yuancheng01/yuancheng.MP3'};
  var ultUrl=ultAudioMap[skillType];
  sfx(ultUrl,0.8);
}
function handleJoy(t){
  if(!joyBase || !joyStick) return;
  var rect=joyBase.getBoundingClientRect();
  var cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;

  // 获取屏幕坐标系中的差值
  var screenDx=t.clientX-cx,screenDy=t.clientY-cy;

  // joyBase被body旋转后，其内部坐标系也被旋转了
  // 需要把屏幕坐标转换到rotated joyBase的本地坐标系
  var localDx=screenDx,localDy=screenDy;
  var isPortraitRotated=document.body.classList.contains('portrait-rotated');
  if(isPortraitRotated && window.screenAdapter){
    // body被rotate(90deg) 顺时针旋转
    // 屏幕坐标系 → 本地坐标系的转换
    // localX = screenY, localY = -screenX
    localDx=screenDy;
    localDy=-screenDx;
  }

  // 限制摇杆范围并计算位置
  var dist=Math.min(Math.hypot(localDx,localDy),56);
  var angle=Math.atan2(localDy,localDx);

  // 更新摇杆视觉位置（相对于joyBase的本地坐标系）
  joyStick.style.left=(42+Math.cos(angle)*dist)+'px';
  joyStick.style.top=(42+Math.sin(angle)*dist)+'px';

  // 游戏移动向量使用本地坐标系的值
  touch.x=Math.cos(angle)*dist/40;
  touch.y=Math.sin(angle)*dist/40;

  // console.log('屏幕dx:'+screenDx+' dy:'+screenDy+' | 本地dx:'+localDx+' dy:'+localDy+' | touch.x:'+touch.x.toFixed(2)+' touch.y:'+touch.y.toFixed(2));
}

function toggleFullscreen(){
  var elem=document.documentElement;
  var btn=document.getElementById('fullscreen-btn');
  if(!document.fullscreenElement && !document.webkitFullscreenElement){
    if(elem.requestFullscreen)elem.requestFullscreen();
    else if(elem.webkitRequestFullscreen)elem.webkitRequestFullscreen();
    else if(elem.msRequestFullscreen)elem.msRequestFullscreen();
    if(btn)btn.style.display='none';
  }else{
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }
}

// 统一初始化入口
function init(){
  console.log('=== 游戏初始化开始 ===');
  loadGameConfig().then(function(success){
    if(!success){
      console.error('配置加载失败！');
      return;
    }
    console.log('配置加载成功，初始化游戏...');
    initGame();
    initVctrl();
    fitScreen();
    console.log('开始游戏循环...');
    tick();
  });
}

// 当 DOM 加载完成时启动
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
}else{
  init();
}
</script>
